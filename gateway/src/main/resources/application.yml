server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway

courtbook:
  jwks-uri: ${COURTBOOK_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  routes:
    user: ${COURTBOOK_ROUTES_USER:http://localhost:8081}
    booking: ${COURTBOOK_ROUTES_BOOKING:http://localhost:8082}
    tournament: ${COURTBOOK_ROUTES_TOURNAMENT:http://localhost:8083}
    notification: ${COURTBOOK_ROUTES_NOTIFICATION:http://localhost:8084}
  cors:
    allowed-origins: ${COURTBOOK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    # Per client IP, per minute.
    requests-per-minute: ${COURTBOOK_RATE_LIMIT:300}
    logins-per-minute: ${COURTBOOK_LOGIN_RATE_LIMIT:10}
    # Only trust X-Forwarded-For when Caddy sits in front (production).
    trust-forwarded-for: ${COURTBOOK_TRUST_FORWARDED_FOR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p"
