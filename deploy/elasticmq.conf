include classpath("application.conf")

# Use whatever host the client called, so queue URLs work from both
# the Docker network (elasticmq:9324) and your Mac (localhost:9324).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

queues {
  courtbook-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "courtbook-events-dlq"
      maxReceiveCount = 5
    }
  }
  courtbook-events-dlq {}
}
