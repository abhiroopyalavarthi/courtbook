name: Deploy

# After CI passes on main: build arm64 images (the EC2 instance is Graviton),
# push them to GitHub Container Registry, then pull and restart on the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        service: [gateway, user-service, booking-service, tournament-service, notification-service, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/courtbook" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && 'frontend' || '.' }}
          build-args: SERVICE=${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}/${{ matrix.service }}:latest
            ${{ steps.name.outputs.prefix }}/${{ matrix.service }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on EC2
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST not set; skipping deploy"; exit 0; fi
          install -m 600 /dev/null key.pem && printf '%s\n' "$KEY" > key.pem
          ssh -i key.pem -o StrictHostKeyChecking=accept-new ec2-user@"$HOST" '
            cd ~/courtbook &&
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull &&
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans &&
            docker image prune -f'
