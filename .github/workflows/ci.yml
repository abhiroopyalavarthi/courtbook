name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java services (unit + Testcontainers + race test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Includes DoubleBookingRaceTest, which runs the 100-thread race 10 times.
      - run: ./gradlew build --no-daemon
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end journey + API contract
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      COURTBOOK_LOGIN_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start everything
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 600
      - name: Install client code
        run: |
          (cd frontend && npm ci)
          (cd e2e && npm ci)
      - name: Run the user journey
        working-directory: e2e
        run: npm run journey
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color > compose-logs.txt; tail -300 compose-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
